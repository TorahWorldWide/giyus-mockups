<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>גיוס לדוכנים · איירביאנבי</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* OpenDesign: airbnb — white canvas, Rausch coral for the one primary action, hairline borders, 14-20px radii, layered soft shadows, price-pill map markers */
:root{--rausch:#ff385c;--deep:#e00b41;--ink:#222;--char:#3f3f3f;--ash:#6a6a6a;--mute:#929292;--hair:#ddd;--cloud:#f7f7f7;
--sh:rgba(0,0,0,.02) 0 0 0 1px,rgba(0,0,0,.04) 0 2px 6px 0,rgba(0,0,0,.1) 0 4px 8px 0}
*{box-sizing:border-box;margin:0}
html,body{font-family:Rubik,system-ui,sans-serif;color:var(--ink);background:#fff}
.search{margin:12px 16px 0;display:flex;align-items:center;gap:12px;border:1px solid var(--hair);border-radius:32px;padding:10px 12px 10px 10px;box-shadow:rgba(0,0,0,.04) 0 2px 6px 0}
.search b{display:block;font:600 15px Rubik}.search span{font:400 13px Rubik;color:var(--ash)}
.search .go{margin-inline-start:auto;width:40px;height:40px;border-radius:50%;background:var(--rausch);display:grid;place-items:center}
.tabs{display:flex;gap:28px;justify-content:center;border-bottom:1px solid var(--hair);margin-top:12px}
.tabs button{border:0;background:none;font:500 14px Rubik;color:var(--ash);padding:10px 2px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-color:var(--ink)}
.tabs svg{width:24px;height:24px}
.mapbox{margin:14px 16px 0;height:330px;border-radius:20px;overflow:hidden;position:relative;box-shadow:var(--sh)}
#map{position:absolute;inset:0;direction:ltr}
.live{position:absolute;bottom:12px;inset-inline-start:12px;z-index:500;background:#fff;border-radius:20px;padding:6px 12px;font:500 13px Rubik;box-shadow:var(--sh);display:flex;gap:6px;align-items:center}
.live i{width:8px;height:8px;border-radius:50%;background:var(--rausch);animation:p 1.2s infinite}@keyframes p{50%{opacity:.3}}
h2{font:600 20px Rubik;margin:20px 16px 4px}.sub{font:400 14px Rubik;color:var(--ash);margin:0 16px 12px}
.rail{display:flex;gap:12px;overflow-x:auto;padding:4px 16px 20px;scroll-snap-type:x mandatory}
.pc{flex:0 0 78%;scroll-snap-align:start;border-radius:20px;box-shadow:var(--sh);padding:16px;background:#fff}
.pc.dim{flex-basis:60%}
.ph{display:flex;gap:12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font:600 18px Rubik;color:#fff;flex:none}
.nm{font:600 16px Rubik}.meta{font:400 13px Rubik;color:var(--ash);margin-top:2px}
.dist{margin-inline-start:auto;text-align:end;font:600 22px Rubik}.dist small{display:block;font:400 12px Rubik;color:var(--ash)}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.bd{border:1px solid var(--hair);border-radius:8px;padding:3px 8px;font:400 12px Rubik;color:var(--char)}
.bd.hot{border-color:var(--ink);font-weight:500;color:var(--ink)}
.cta{width:100%;border:0;border-radius:8px;background:var(--rausch);color:#fff;font:600 16px Rubik;padding:14px}
.more{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.more button{border:1px solid var(--ink);background:#fff;border-radius:8px;padding:9px 0;font:500 12px Rubik;color:var(--ink)}
.list{display:none;padding:4px 16px 24px}
.view-list .list{display:block}.view-list .mapbox,.view-list .rail,.view-list .mapcap{display:none}
.lr{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--hair)}
.lr .av{width:48px;height:48px;font-size:15px}
.lr .call{width:44px;height:44px;border-radius:50%;border:1px solid var(--hair);display:grid;place-items:center;flex:none}
.pill{background:#fff;border-radius:28px;padding:5px 10px;font:600 13px Rubik;color:var(--ink);box-shadow:0 0 0 1px rgba(0,0,0,.08),0 2px 4px rgba(0,0,0,.18);white-space:nowrap;transform:translate(-50%,-50%);display:inline-block}
.pill.sel{background:var(--ink);color:#fff;transform:translate(-50%,-50%) scale(1.1)}
.pill.done{color:var(--mute)}
.stm{width:40px;height:40px;border-radius:50%;background:var(--rausch);color:#fff;display:grid;place-items:center;font:700 14px Rubik;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.stm.full{background:#fff;color:var(--ink);border-color:var(--ink)}
.leaflet-control-attribution{font-size:9px}.leaflet-tile-pane{filter:saturate(.55) brightness(1.04)}
</style></head><body>
<div class="search">
  <div><b id="stName"></b><span id="stSub"></span></div>
  <div class="go"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></div>
</div>
<div class="tabs">
  <button data-v="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2Z"/><path d="M9 4v14M15 6v14"/></svg>מפה</button>
  <button data-v="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>לפי מרחק</button>
  <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 21V8l9-5 9 5v13"/><path d="M9 21v-6h6v6"/></svg>כל הדוכנים</button>
</div>
<div class="mapbox"><div id="map"></div><div class="live"><i></i>שי מדבר עכשיו עם רונית</div></div>
<h2 class="mapcap">הכי קרובים לדוכן</h2><div class="sub mapcap">החליקו לצדדים · נגיעה בשם במפה פותחת אותו</div>
<div class="rail" id="rail"></div>
<div class="list" id="list"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const S = MOCK.stands[0], near = MOCK.near(S), sel = near[0];
const COL = ['#e07a5f', '#3d8a7a', '#6d5bd0', '#c9852b', '#3b7ea1', '#b5527a', '#5b8c3a', '#8a6d4b', '#4d6fd1'];
const col = p => COL[p.id % COL.length], ini = n => n.split(' ').map(w => w[0]).join('');
document.getElementById('stName').textContent = 'דוכן ' + S.name;
document.getElementById('stSub').textContent = `חשיבות ${S.imp} · חסרים ${S.need - S.have} מתוך ${S.need}`;
const setV = v => { document.body.classList.toggle('view-list', v === 'list'); document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); };
document.querySelectorAll('.tabs button[data-v]').forEach(b => b.onclick = () => setV(b.dataset.v)); setV(MOCK.view);
const map = L.map('map', { zoomControl: false, attributionControl: true }).setView([S.lat, S.lng], 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
MOCK.stands.forEach(s => L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', iconSize: [0, 0],
  html: `<div class="stm ${s.have >= s.need ? 'full' : ''}">${s.need - s.have || '✓'}</div>` }) }).addTo(map));
near.forEach(p => L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', iconSize: [0, 0],
  html: `<div class="pill ${p.id === sel.id ? 'sel' : ''} ${p.st === 'placed' ? 'done' : ''}">${p.name.split(' ')[0]} · ${p.m}מ׳</div>` }) }).addTo(map));
const badges = p => `<span class="bd hot">${MOCK.stLabel[p.st]}${p.by ? ' · ' + p.by : ''}${p.tries ? ' ' + p.tries + '/3' : ''}${p.when ? ' ' + p.when : ''}</span><span class="bd">${p.tag}</span>${p.reg ? `<span class="bd">רשום ל${p.reg}</span>` : ''}`;
const head = p => `<div class="ph"><div class="av" style="background:${col(p)}">${ini(p.name)}</div><div><div class="nm">${p.name}</div><div class="meta">גר ליד הדוכן</div></div><div class="dist">${p.m}<small>מטר</small></div></div>`;
document.getElementById('rail').innerHTML = near.slice(0, 4).map((p, i) => `<div class="pc ${i ? 'dim' : ''}">${head(p)}<div class="badges">${badges(p)}</div>
  ${i ? '' : `<button class="cta">התקשרו ל${p.name.split(' ')[0]}</button><div class="more"><button>וואטסאפ</button><button>שיבוץ</button><button>לא ענה</button><button>לחזור</button></div>`}</div>`).join('');
document.getElementById('list').innerHTML = near.map(p => `<div class="lr"><div class="av" style="background:${col(p)}">${ini(p.name)}</div>
  <div style="flex:1"><div class="nm">${p.name}</div><div class="meta">${MOCK.stLabel[p.st]}${p.by ? ' · ' + p.by : ''}${p.tries ? ' · ' + p.tries + '/3' : ''} · ${p.tag}</div></div>
  <div class="dist" style="font-size:18px">${p.m}<small>מטר</small></div>
  <div class="call"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="1.8"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2Z"/></svg></div></div>`).join('');
</script></body></html>
