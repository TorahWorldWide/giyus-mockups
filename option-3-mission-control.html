<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>גיוס לדוכנים · חדר בקרה</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* OpenDesign: mission-control — navy canvas, panels with 1px borders, amber telemetry values in mono, cyan = active, red = critical, green = nominal, 2-4px radii */
:root{--bg:#0B1120;--sf:#111827;--sfh:#1A2535;--sfa:#1E3A5F;--bd:#1E3A5F;--bds:#162035;--amber:#FFB800;--cyan:#00D4FF;--red:#FF4757;--warn:#FF9F43;--ok:#26DE81;--t1:#E8F0FE;--t2:#8BA3C7;--t3:#4A6080;--mono:"JetBrains Mono",ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{font-family:Heebo,system-ui,sans-serif;color:var(--t1);background:var(--bg);font-size:14px}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)}
.bar h1{font:600 16px Heebo}.bar .op{margin-inline-start:auto;font:600 11px Heebo;color:var(--t2);letter-spacing:.05em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 12px}
.tile{background:var(--sf);border:1px solid var(--bd);border-radius:4px;padding:8px 10px}
.tl{font:600 11px Heebo;color:var(--t2);margin-bottom:4px}
.tv{font:700 24px/1 var(--mono);color:var(--amber)}.tv.r{color:var(--red)}.tv.c{color:var(--cyan)}
.tv small{font:500 11px var(--mono);color:var(--t3);margin-inline-start:3px}
.seg{display:flex;margin:0 12px;border:1px solid var(--bd);border-radius:4px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--sf);color:var(--t2);font:600 12px Heebo;padding:8px;letter-spacing:.04em}
.seg button.on{background:var(--sfa);color:var(--t1)}
.panel{margin:10px 12px;border:1px solid var(--bd);border-radius:4px;background:var(--sf);overflow:hidden}
.ph{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bds);font:600 12px Heebo;color:var(--t2)}
.ph b{color:var(--t1);font-size:13px}.ph .coord{margin-inline-start:auto;font:500 11px var(--mono);color:var(--t3);direction:ltr}
.mapw{height:300px;position:relative}#map{position:absolute;inset:0;direction:ltr;background:#0B1120}
.alert{position:absolute;top:8px;inset-inline:8px;z-index:500;background:rgba(0,212,255,.12);border:1px solid rgba(0,212,255,.4);color:var(--cyan);border-radius:4px;padding:6px 10px;font:500 12px Heebo;display:flex;gap:8px;align-items:center;backdrop-filter:blur(4px)}
.alert i{width:7px;height:7px;border-radius:50%;background:var(--cyan);animation:p 1s infinite}@keyframes p{50%{opacity:.2}}
.badge{font:600 10px Heebo;letter-spacing:.05em;padding:2px 8px;border-radius:2px;border:1px solid;white-space:nowrap}
.b-new{color:var(--t2);border-color:var(--bd);background:var(--bds)}
.b-calling{color:var(--cyan);border-color:rgba(0,212,255,.3);background:rgba(0,212,255,.15)}
.b-noans{color:var(--warn);border-color:rgba(255,159,67,.3);background:rgba(255,159,67,.15)}
.b-back{color:var(--amber);border-color:rgba(255,184,0,.3);background:rgba(255,184,0,.12)}
.b-placed{color:var(--ok);border-color:rgba(38,222,129,.3);background:rgba(38,222,129,.15)}
.sel{padding:10px;border-bottom:1px solid var(--bds);background:var(--sfh)}
.sr{display:flex;align-items:center;gap:10px}
.nm{font:600 15px Heebo}.meta{font:400 12px Heebo;color:var(--t2);margin-top:2px}
.m{margin-inline-start:auto;font:700 22px var(--mono);color:var(--amber);direction:ltr}.m small{font:500 11px var(--mono);color:var(--t3)}
.acts{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px;margin-top:10px}
.acts button{border:1px solid var(--bd);background:var(--sf);color:var(--t1);border-radius:4px;padding:10px 4px;font:600 12px Heebo}
.acts .go{background:var(--ok);color:#0B1120;border-color:var(--ok);font-size:14px;grid-row:span 2}
table{width:100%;border-collapse:collapse}
td{padding:9px 10px;border-bottom:1px solid var(--bds);vertical-align:middle}
td.d{font:700 15px var(--mono);color:var(--amber);text-align:left;direction:ltr;width:64px}
td .n{font:500 14px Heebo}td .s{font:400 11px Heebo;color:var(--t3)}
.listonly{display:none}.view-list .listonly{display:block}.view-list .maponly{display:none}.view-list .sel{display:none}
.stk{width:34px;height:34px;border-radius:4px;background:rgba(255,71,87,.2);border:2px solid var(--red);color:var(--red);display:grid;place-items:center;font:700 14px var(--mono);transform:translate(-50%,-50%);box-shadow:0 0 12px rgba(255,71,87,.6)}
.stk.full{background:rgba(38,222,129,.15);border-color:var(--ok);color:var(--ok);box-shadow:none}
.pt{width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid var(--bg);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--amber)}
.pt.calling{background:var(--cyan);box-shadow:0 0 0 4px rgba(0,212,255,.3)}.pt.noans{background:var(--warn)}.pt.placed{background:var(--ok)}.pt.back{background:#fff}
.pt.selp{width:20px;height:20px;box-shadow:0 0 0 2px var(--amber),0 0 14px var(--amber)}
.lbl{font:500 10px var(--mono);color:var(--t1);background:rgba(11,17,32,.8);padding:1px 4px;border-radius:2px;white-space:nowrap;transform:translate(10px,-50%);display:inline-block}
.leaflet-tile-pane{filter:invert(1) hue-rotate(200deg) brightness(.75) contrast(.9) saturate(.4)}
.leaflet-control-attribution{font-size:9px;background:rgba(11,17,32,.7)!important;color:var(--t3)}.leaflet-control-attribution a{color:var(--t2)}
</style></head><body>
<div class="bar"><div class="dot"></div><h1>גיוס לדוכנים</h1><div class="op">טלפן: תומר · 3 מחוברים</div></div>
<div class="tiles">
  <div class="tile"><div class="tl">דוכנים חסרים</div><div class="tv r">66</div></div>
  <div class="tile"><div class="tl">מתקשרים עכשיו</div><div class="tv c">3</div></div>
  <div class="tile"><div class="tl">שובצו היום</div><div class="tv">12</div></div>
</div>
<div class="seg"><button data-v="map">מפה</button><button data-v="list">רשימה לפי מטרים</button></div>
<div class="panel">
  <div class="ph"><span class="badge b-noans" style="color:var(--red);border-color:rgba(255,71,87,.3);background:rgba(255,71,87,.15)">חסרים 2</span><b id="stn"></b><span class="coord" id="crd"></span></div>
  <div class="mapw maponly"><div id="map"></div><div class="alert"><i></i>שי ↔ רונית כהן · 02:14</div></div>
  <div class="sel" id="sel"></div>
  <table id="tbl"></table>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="data.js"></script>
<script>
const S = MOCK.stands[0], near = MOCK.near(S), sel = near[0];
document.getElementById('stn').textContent = S.name + ' · חשיבות ' + S.imp;
document.getElementById('crd').textContent = S.lat.toFixed(4) + 'N ' + S.lng.toFixed(4) + 'E';
const setV = v => { document.body.classList.toggle('view-list', v === 'list'); document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === v)); };
document.querySelectorAll('.seg button').forEach(b => b.onclick = () => setV(b.dataset.v)); setV(MOCK.view);
const map = L.map('map', { zoomControl: false }).setView([S.lat, S.lng], 16);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
[250, 500].forEach(r => L.circle([S.lat, S.lng], { radius: r, color: '#00D4FF', weight: 1, opacity: .5, dashArray: '2 6', fill: false }).addTo(map));
MOCK.stands.forEach(s => L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', iconSize: [0, 0], html: `<div class="stk ${s.have >= s.need ? 'full' : ''}">${s.need - s.have || '✓'}</div>` }) }).addTo(map));
near.forEach(p => L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', iconSize: [0, 0],
  html: `<div class="pt ${p.st} ${p.id === sel.id ? 'selp' : ''}"></div>${p.m <= 320 ? `<div class="lbl" style="position:absolute;top:0;left:0">${p.m}m</div>` : ''}` }) }).addTo(map));
const meta = p => `${p.tag}${p.reg ? ' · רשום ל' + p.reg : ''}`;
const badge = p => `<span class="badge b-${p.st}">${MOCK.stLabel[p.st]}${p.by ? ' · ' + p.by : ''}${p.tries ? ' ' + p.tries + '/3' : ''}${p.when ? ' ' + p.when : ''}</span>`;
document.getElementById('sel').innerHTML = `<div class="sr"><div><div class="nm">${sel.name} ${badge(sel)}</div><div class="meta">${meta(sel)}</div></div><div class="m">${sel.m}<small>m</small></div></div>
  <div class="acts"><button class="go">התקשר</button><button>וואטסאפ</button><button>שבץ</button><button>לא ענה</button><button>לחזור</button></div>`;
document.getElementById('tbl').innerHTML = (MOCK.view === 'list' ? near : near.slice(1, 5)).map(p => `<tr><td><div class="n">${p.name}</div><div class="s">${meta(p)}</div></td><td>${badge(p)}</td><td class="d">${p.m}</td></tr>`).join('');
</script></body></html>
